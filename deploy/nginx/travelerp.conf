# ==============================================================================
# Nginx Reverse Proxy Configuration for TravelERP (Siva Gayathri Tours & Travels)
# Production-Hardened for High Throughput, Static Asset Caching & DDoS Resistance
# ==============================================================================

# Rate Limiting Zones (Prevents API abuse and brute-force attacks)
limit_req_zone $binary_remote_addr zone=travelerp_api_rate:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=travelerp_login_rate:10m rate=5r/s;

# Connection & Worker Upstream Configuration
upstream travelerp_upstream {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 64;
}

# Map for WebSocket and Server-Sent Events Connection Upgrading
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# HTTP -> HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sivagayathiritravels.com www.sivagayathiritravels.com erp.sivagayathiritravels.com;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Production Virtual Host
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.sivagayathiritravels.com sivagayathiritravels.com;

    # SSL Certificates (Managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/erp.sivagayathiritravels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.sivagayathiritravels.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/erp.sivagayathiritravels.com/chain.pem;

    # Modern TLS Security & Ciphers (Mozilla Intermediate Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Client Request Body Limits (Supports inspection photos, receipt PDFs up to 35MB)
    client_max_body_size 35M;
    client_body_buffer_size 256k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 32k;

    # Gzip Dynamic & Static Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        font/woff;

    # --------------------------------------------------------------------------
    # Static Assets (Direct High-Speed Disk Serving with 1-Year Immutable Cache)
    # --------------------------------------------------------------------------
    location /static/ {
        alias /var/www/travelerp/staticfiles/;
        expires 365d;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        tcp_nodelay off;
        open_file_cache max=3000 inactive=120s;
        open_file_cache_valid 45s;
        open_file_cache_min_uses 2;
        open_file_cache_errors off;
    }

    # --------------------------------------------------------------------------
    # Uploaded Media Files (Receipts, Inspection Photos, Odometer Selfies)
    # --------------------------------------------------------------------------
    location /media/ {
        alias /var/www/travelerp/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --------------------------------------------------------------------------
    # Favicon and Robots
    # --------------------------------------------------------------------------
    location = /favicon.ico {
        alias /var/www/travelerp/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        alias /var/www/travelerp/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Login & Authentication Endpoint (Strict Rate Limiting)
    # --------------------------------------------------------------------------
    location /accounts/login/ {
        limit_req zone=travelerp_login_rate burst=10 nodelay;

        proxy_pass http://travelerp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # High-Frequency Real-Time Telematics & Commuter APIs
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=travelerp_api_rate burst=50 nodelay;

        proxy_pass http://travelerp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive buffer
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # --------------------------------------------------------------------------
    # Main Application Proxy (Gunicorn + Uvicorn ASGI)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://travelerp_upstream;
        proxy_http_version 1.1;

        # Pass WebSocket upgrade headers for real-time tracking
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts (Allows long batch dispatches or PDF downloads without 504)
        proxy_connect_timeout 60s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 128k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;
    }
}
