# ==============================================================================
# Siva Gayathri Tours & Travels — TravelERP Unified Production Stack
# High-concurrency ASGI Daphne/Gunicorn + PostgreSQL 15/PostGIS/pgvector +
# Redis 7 + Nginx SSL Reverse Proxy + Automated PostgreSQL Backup Service + OSRM GIS
# ==============================================================================

networks:
  travelerp_network:
    name: travelerp_network
    driver: bridge

volumes:
  postgis_data:
    name: travelerp_postgis_data
  redis_data:
    name: travelerp_redis_data
  static_volume:
    name: travelerp_static_volume
  media_volume:
    name: travelerp_media_volume
  backups_volume:
    name: travelerp_backups_volume

services:
  # ----------------------------------------------------------------------------
  # 1. TravelERP Core ASGI Web Application (Django + Channels + Daphne/Gunicorn)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: travelerp_web:latest
    container_name: travelerp_web
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=travelerp.settings
      - DEBUG=False
      - USE_POSTGRES=1
      - DATABASE_URL=postgres://travel_gis_user:travel_gis_pass@postgis:5432/travel_erp_gis
      - PG_HOST=postgis
      - PG_PORT=5432
      - PG_DB=travel_erp_gis
      - PG_USER=travel_gis_user
      - PG_PASS=travel_gis_pass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/1
      - GROQ_API_KEY=${GROQ_API_KEY:-gsk_your_groq_api_key_here}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - GUNICORN_WORKERS=5
      - GUNICORN_BIND=0.0.0.0:8000
      - RUN_MIGRATIONS=1
      - COLLECT_STATIC=1
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - backups_volume:/app/backups
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travelerp_network
    expose:
      - "8000"

  # ----------------------------------------------------------------------------
  # 2. PostgreSQL 15 + PostGIS 3.4 + pgvector Spatial & Vector Database
  # ----------------------------------------------------------------------------
  postgis:
    build:
      context: ./gis_stack/postgis
      dockerfile: Dockerfile
    image: travelerp_postgis:15-pgvector
    container_name: travelerp_postgis
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: travel_erp_gis
      POSTGRES_USER: travel_gis_user
      POSTGRES_PASSWORD: travel_gis_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./gis_stack/postgis/init_postgis.sql:/docker-entrypoint-initdb.d/init_postgis.sql:ro
      - postgis_data:/var/lib/postgresql/data
    networks:
      - travelerp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_gis_user -d travel_erp_gis"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. High-Performance In-Memory Cache & Channel Layer (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: travelerp_redis
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - travelerp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. Automated PostgreSQL Backup Daemon (Cron Service + SHA256 Checksums)
  # ----------------------------------------------------------------------------
  backup:
    image: postgres:15-alpine
    container_name: travelerp_backup
    restart: always
    environment:
      PG_HOST: postgis
      PG_PORT: 5432
      PG_DB: travel_erp_gis
      PG_USER: travel_gis_user
      PGPASSWORD: travel_gis_pass
      BACKUP_CRON: "0 2 * * *"
      BACKUP_ON_STARTUP: "1"
      BACKUP_DIR: /backups
    volumes:
      - backups_volume:/backups
      - ./deploy/backup/backup_postgres.sh:/scripts/backup_postgres.sh:ro
      - ./deploy/backup/restore_postgres.sh:/scripts/restore_postgres.sh:ro
      - ./deploy/backup/entrypoint_backup.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - travelerp_network

  # ----------------------------------------------------------------------------
  # 5. Production Nginx Reverse Proxy with TLS/SSL & WebSocket Upgrades
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: travelerp_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/travelerp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - static_volume:/var/www/travelerp/staticfiles:ro
      - media_volume:/var/www/travelerp/media:ro
    depends_on:
      - web
    networks:
      - travelerp_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 6. TileServer GL (Self-Hosted Vector/Raster Map Tile Engine)
  # ----------------------------------------------------------------------------
  tileserver:
    image: maptiler/tileserver-gl:latest
    container_name: travelerp_tileserver
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - ./gis_stack/tileserver:/data
    command: ["-c", "/data/config.json", "-p", "8080"]
    networks:
      - travelerp_network

  # ----------------------------------------------------------------------------
  # 7. OSRM Routing Engine (Sub-10ms Distance Matrices & Turn-by-Turn Routing)
  # ----------------------------------------------------------------------------
  osrm:
    image: osrm/osrm-backend:latest
    container_name: travelerp_osrm
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./gis_stack/osrm/data:/data
    command:
      - sh
      - -c
      - |
        if [ -f /data/india.osrm ]; then
          osrm-routed --algorithm mld /data/india.osrm
        else
          tail -f /dev/null
        fi
    networks:
      - travelerp_network
