version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # TravelERP Backend (Gunicorn + ASGI Uvicorn)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelerp_web
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn travelerp.asgi:application -c gunicorn.conf.py"
    environment:
      - DJANGO_SETTINGS_MODULE=travelerp.settings
      - DEBUG=False
      - GUNICORN_WORKERS=5
      - GUNICORN_BIND=0.0.0.0:8000
      - REDIS_URL=redis://redis:6379/1
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=${DB_NAME:-travelerp}
      - DB_USER=${DB_USER:-travelerp_user}
      - DB_PASSWORD=${DB_PASSWORD:-StrongPass2026!}
      - DB_HOST=db
      - DB_PORT=3306
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travelerp_network
    expose:
      - "8000"

  # ----------------------------------------------------------------------------
  # High-Performance In-Memory Cache (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: travelerp_redis
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - travelerp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # Enterprise Relational Database (MySQL 8.0)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: travelerp_mysql
    restart: always
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=2
      --max-connections=250
    environment:
      MYSQL_DATABASE: ${DB_NAME:-travelerp}
      MYSQL_USER: ${DB_USER:-travelerp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-StrongPass2026!}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootRootPass2026!}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - travelerp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Reverse Proxy & Edge Cache (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: travelerp_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/travelerp.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/travelerp/staticfiles:ro
      - media_volume:/var/www/travelerp/media:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_challenge:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - travelerp_network

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_certs:
  certbot_challenge:

networks:
  travelerp_network:
    driver: bridge
