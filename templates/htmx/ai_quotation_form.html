<!-- 🤖 AI Quotation Form (HTMX Partial) -->
<div class="bg-slate-800/50 rounded-xl p-6 border border-slate-700/50 backdrop-blur-sm">
  <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
    🤖 <span>Dynamic AI Quotation Calculator</span>
  </h3>
  <form hx-get="/htmx/quotation/ai-calc/" hx-target="#quotation-result" hx-indicator="#calc-spinner" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div>
      <label class="block text-xs text-slate-400 mb-1">Origin City</label>
      <input type="text" name="origin" placeholder="e.g. Chennai" required
             class="w-full px-3 py-2 rounded-lg bg-slate-900/80 text-white border border-slate-600 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 text-sm">
    </div>
    <div>
      <label class="block text-xs text-slate-400 mb-1">Destination City</label>
      <input type="text" name="destination" placeholder="e.g. Ooty" required
             class="w-full px-3 py-2 rounded-lg bg-slate-900/80 text-white border border-slate-600 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 text-sm">
    </div>
    <div>
      <label class="block text-xs text-slate-400 mb-1">Vehicle Type</label>
      <select name="vehicle_type_id" class="w-full px-3 py-2 rounded-lg bg-slate-900/80 text-white border border-slate-600 text-sm">
        <option value="">Auto-Select Best</option>
        {% for vt in vehicle_types %}
        <option value="{{ vt.pk }}">{{ vt.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-xs text-slate-400 mb-1">Trip Type</label>
      <select name="trip_type" class="w-full px-3 py-2 rounded-lg bg-slate-900/80 text-white border border-slate-600 text-sm">
        <option value="one_way">One Way</option>
        <option value="round_trip" selected>Round Trip</option>
        <option value="multi_day">Multi-Day Package</option>
      </select>
    </div>
    <div>
      <label class="block text-xs text-slate-400 mb-1">Duration (Days)</label>
      <input type="number" name="duration_days" value="1" min="1" max="30"
             class="w-full px-3 py-2 rounded-lg bg-slate-900/80 text-white border border-slate-600 text-sm">
    </div>
    <div>
      <label class="block text-xs text-slate-400 mb-1">Passengers</label>
      <input type="number" name="pax_count" value="1" min="1"
             class="w-full px-3 py-2 rounded-lg bg-slate-900/80 text-white border border-slate-600 text-sm">
    </div>
    <div>
      <label class="block text-xs text-slate-400 mb-1">Custom KM (Optional)</label>
      <input type="number" name="custom_km" placeholder="Auto-compute"
             class="w-full px-3 py-2 rounded-lg bg-slate-900/80 text-white border border-slate-600 text-sm">
    </div>
    <div>
      <label class="block text-xs text-slate-400 mb-1">GST Rate (%)</label>
      <input type="text" name="gst_rate" value="5"
             class="w-full px-3 py-2 rounded-lg bg-slate-900/80 text-white border border-slate-600 text-sm">
    </div>
    <div class="flex items-end">
      <button type="submit"
              class="w-full px-4 py-2.5 rounded-lg bg-gradient-to-r from-sky-600 to-indigo-600 text-white font-bold text-sm hover:from-sky-500 hover:to-indigo-500 transition-all flex items-center justify-center gap-2">
        🤖 Generate AI Quote
        <span id="calc-spinner" class="htmx-indicator">
          <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </span>
      </button>
    </div>
  </form>
</div>
<div id="quotation-result" class="mt-4"></div>
