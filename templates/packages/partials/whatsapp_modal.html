<!-- WhatsApp 1-Click Briefing Generator Modal -->
<div id="sg-whatsapp-modal-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl max-w-2xl w-full p-6 text-slate-100 flex flex-col gap-4 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-emerald-400 text-2xl">chat</span>
                <h3 class="text-base font-bold text-slate-100 m-0">1-Click WhatsApp Tour Briefing Generator</h3>
            </div>
            <button type="button" onclick="closeWhatsAppModal()" class="text-slate-400 hover:text-white p-1 rounded-md">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <div class="flex gap-2 border-b border-slate-800 pb-2">
            <button type="button" onclick="switchWaTab('client')" id="wa-tab-client" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white">Client Proposal Pitch</button>
            <button type="button" onclick="switchWaTab('driver')" id="wa-tab-driver" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Driver Logistics Briefing</button>
            <button type="button" onclick="switchWaTab('faculty')" id="wa-tab-faculty" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Faculty / Group Coordinator</button>
        </div>

        <!-- Content 1: Client Pitch -->
        <div id="wa-box-client" class="wa-content-box">
            <label class="block text-xs font-semibold text-slate-400 mb-1">Message Preview:</label>
            <textarea id="wa-text-client" rows="8" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs font-mono text-slate-200 resize-none focus:outline-none focus:border-emerald-500">{{ client_pitch }}</textarea>
            <div class="flex items-center justify-end gap-2 mt-3">
                <button type="button" onclick="copyWaText('wa-text-client')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md text-xs font-semibold flex items-center gap-1 border border-slate-700">
                    <span class="material-symbols-outlined text-sm">content_copy</span> Copy Text
                </button>
                <button type="button" onclick="sendWhatsAppDirect('wa-text-client')" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-md text-xs font-bold flex items-center gap-1 shadow-md">
                    <span class="material-symbols-outlined text-sm">send</span> Open WhatsApp
                </button>
            </div>
        </div>

        <!-- Content 2: Driver Dispatch -->
        <div id="wa-box-driver" class="wa-content-box hidden">
            <label class="block text-xs font-semibold text-slate-400 mb-1">Message Preview:</label>
            <textarea id="wa-text-driver" rows="8" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs font-mono text-slate-200 resize-none focus:outline-none focus:border-emerald-500">{{ driver_dispatch }}</textarea>
            <div class="flex items-center justify-end gap-2 mt-3">
                <button type="button" onclick="copyWaText('wa-text-driver')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md text-xs font-semibold flex items-center gap-1 border border-slate-700">
                    <span class="material-symbols-outlined text-sm">content_copy</span> Copy Text
                </button>
                <button type="button" onclick="sendWhatsAppDirect('wa-text-driver')" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-md text-xs font-bold flex items-center gap-1 shadow-md">
                    <span class="material-symbols-outlined text-sm">send</span> Open WhatsApp
                </button>
            </div>
        </div>

        <!-- Content 3: Faculty Briefing -->
        <div id="wa-box-faculty" class="wa-content-box hidden">
            <label class="block text-xs font-semibold text-slate-400 mb-1">Message Preview:</label>
            <textarea id="wa-text-faculty" rows="8" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs font-mono text-slate-200 resize-none focus:outline-none focus:border-emerald-500">{{ faculty_briefing }}</textarea>
            <div class="flex items-center justify-end gap-2 mt-3">
                <button type="button" onclick="copyWaText('wa-text-faculty')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md text-xs font-semibold flex items-center gap-1 border border-slate-700">
                    <span class="material-symbols-outlined text-sm">content_copy</span> Copy Text
                </button>
                <button type="button" onclick="sendWhatsAppDirect('wa-text-faculty')" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-md text-xs font-bold flex items-center gap-1 shadow-md">
                    <span class="material-symbols-outlined text-sm">send</span> Open WhatsApp
                </button>
            </div>
        </div>
    </div>
</div>
