<!-- Proposal Live 5-Page Preview Modal -->
<div id="sg-proposal-modal-backdrop" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full max-w-5xl h-[85vh] text-slate-100 flex flex-col">
        <div class="flex items-center justify-between border-b border-slate-800 p-4">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-sky-400 text-2xl">picture_as_pdf</span>
                <h3 class="text-base font-bold text-slate-100 m-0">Live Tour Proposal Quotation Preview (5-Page Format)</h3>
            </div>
            <div class="flex items-center gap-2">
                <a href="{{ quote_url }}" target="_blank" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white rounded-md text-xs font-semibold flex items-center gap-1 shadow-sm">
                    <span class="material-symbols-outlined text-sm">open_in_new</span> Open in New Tab
                </a>
                <button type="button" onclick="closeProposalModal()" class="text-slate-400 hover:text-white p-1 rounded-md">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
        </div>
        <div class="grow w-full bg-slate-950 p-2">
            <iframe src="{{ quote_url }}" class="w-full h-full rounded border border-slate-800 bg-white" title="Quotation Proposal Preview"></iframe>
        </div>
    </div>
</div>
