<!-- Proposal Live 5-Page Preview Modal (100% Light Mode Self-Contained) -->
<style>
.sg-prop-backdrop {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
}
.sg-prop-card {
    background: #ffffff; border: 1px solid #e2e8f0; border-radius: 18px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    max-width: 1050px; width: 100%; height: 86vh; color: #0f172a;
    display: flex; flex-direction: column; overflow: hidden;
    box-sizing: border-box;
}
.sg-prop-header {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #f1f5f9; padding: 16px 20px;
}
.sg-prop-title-row {
    display: flex; align-items: center; gap: 10px;
}
.sg-prop-title-row h3 {
    font-size: 16px; font-weight: 800; color: #0f172a; margin: 0;
}
.sg-prop-actions {
    display: flex; align-items: center; gap: 10px;
}
.sg-prop-btn-tab {
    padding: 7px 14px; background: #0284c7; color: #ffffff; text-decoration: none;
    border-radius: 8px; font-size: 12px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3);
}
.sg-prop-btn-tab:hover {
    background: #0369a1;
}
.sg-prop-close-btn {
    background: transparent; border: none; color: #94a3b8; cursor: pointer;
    border-radius: 8px; padding: 6px; display: grid; place-items: center;
    transition: all 0.15s; font-size: 18px;
}
.sg-prop-close-btn:hover {
    background: #f1f5f9; color: #0f172a;
}
.sg-prop-body {
    flex-grow: 1; width: 100%; background: #f8fafc; padding: 12px;
    box-sizing: border-box;
}
.sg-prop-iframe {
    width: 100%; height: 100%; border-radius: 12px;
    border: 1px solid #cbd5e1; background: #ffffff;
}
</style>

<div id="sg-proposal-modal-backdrop" class="sg-prop-backdrop">
    <div class="sg-prop-card">
        <div class="sg-prop-header">
            <div class="sg-prop-title-row">
                <span style="font-size: 22px;">📄</span>
                <h3>Live Tour Proposal Quotation Preview (5-Page Format)</h3>
            </div>
            <div class="sg-prop-actions">
                <a href="{{ quote_url }}" target="_blank" class="sg-prop-btn-tab">
                    ↗ Open in New Tab
                </a>
                <button type="button" onclick="closeProposalModal()" class="sg-prop-close-btn" title="Close">✕</button>
            </div>
        </div>
        <div class="sg-prop-body">
            <iframe src="{{ quote_url }}" class="sg-prop-iframe" title="Quotation Proposal Preview"></iframe>
        </div>
    </div>
</div>

<script>
function closeProposalModal() {
    var modal = document.getElementById('sg-proposal-modal-backdrop');
    if (modal) modal.remove();
}
</script>
