<!-- Category Operational Intelligence & Protocol Card -->
<div class="rounded-lg border border-slate-700 bg-slate-900/90 text-slate-100 p-4 mb-4 shadow-lg backdrop-blur-sm transition-all duration-300">
    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3 mb-3">
        <div class="flex items-center gap-2">
            <span class="px-2.5 py-1 rounded text-xs font-bold uppercase tracking-wider {{ intel.badge_class }}">
                {{ intel.badge }}
            </span>
            <h3 class="text-sm font-semibold text-slate-200 m-0">
                {{ intel.title }}
            </h3>
        </div>
        <div class="flex items-center gap-1.5">
            <span class="text-xs text-slate-400 font-medium">Quick Jumps:</span>
            {% for jump in intel.jump_links %}
            <button type="button" 
                    onclick="scrollToSection('{{ jump.target }}')"
                    class="px-2 py-0.5 text-[11px] font-medium rounded bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700 transition-colors">
                {{ jump.label }} &darr;
            </button>
            {% endfor %}
        </div>
    </div>

    <!-- Rules Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 mb-3">
        {% for rule in intel.rules %}
        <div class="flex items-start gap-2.5 p-2.5 rounded bg-slate-800/60 border border-slate-800">
            <span class="material-symbols-outlined text-amber-400 text-lg mt-0.5 shrink-0">{{ rule.icon }}</span>
            <div class="min-w-0">
                <div class="text-xs font-semibold text-slate-200">{{ rule.label }}</div>
                <div class="text-[11px] text-slate-400 leading-tight mt-0.5">{{ rule.desc }}</div>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- Recommended Inclusions Checklist -->
    <div class="p-2.5 rounded bg-slate-950/60 border border-slate-800/80 text-[11px] leading-relaxed text-slate-300 flex items-start gap-2">
        <span class="material-symbols-outlined text-emerald-400 text-sm mt-0.5 shrink-0">verified</span>
        <div>
            <strong class="text-emerald-400">Standard Category Inclusions:</strong>
            {{ intel.recommended_inclusions }}
            <button type="button" 
                    onclick="applyInclusionsPreset(`{{ intel.recommended_inclusions|escapejs }}`, `{{ intel.recommended_exclusions|escapejs }}`)"
                    class="ml-2 px-2 py-0.5 rounded bg-emerald-700/60 hover:bg-emerald-600 text-white font-semibold text-[10px] transition-colors">
                Apply to Checklist
            </button>
        </div>
    </div>
</div>
