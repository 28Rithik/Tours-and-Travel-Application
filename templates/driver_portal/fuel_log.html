{% extends "driver_portal/base.html" %}

{% block title %}Log Fuel Refill | Sivagayathiri Fleet{% endblock %}

{% block content %}
<div style="margin-bottom: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
        <div>
            <h1 style="font-size: 20px; font-weight: 800;">Log Fuel Purchase</h1>
            <p style="font-size: 12px; color: var(--text-secondary);">Submit highway fuel slip & meter reading</p>
        </div>
        <div style="font-size: 26px;">⛽</div>
    </div>
</div>

<div class="card">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
                🚗 Select Vehicle
            </label>
            <select 
                name="vehicle_id" 
                required
                style="width: 100%; padding: 12px 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 15px; font-weight: 700;"
            >
                {% for v in vehicles %}
                    <option value="{{ v.pk }}" {% if default_vehicle and default_vehicle.pk == v.pk %}selected{% endif %}>
                        {{ v.registration_number }} - {{ v.brand }} {{ v.model }} ({{ v.fuel_type|upper }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
            <div>
                <label style="display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
                    Fuel Litres (L)
                </label>
                <input 
                    type="number" 
                    step="0.01" 
                    name="fuel_quantity" 
                    placeholder="e.g. 45.5" 
                    required
                    style="width: 100%; padding: 12px 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 16px; font-weight: 700;"
                >
            </div>
            <div>
                <label style="display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
                    Rate / Litre (₹)
                </label>
                <input 
                    type="number" 
                    step="0.01" 
                    name="fuel_price" 
                    placeholder="e.g. 96.50" 
                    required
                    style="width: 100%; padding: 12px 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 16px; font-weight: 700;"
                >
            </div>
        </div>

        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
                Petrol Station / Bunk Details
            </label>
            <input 
                type="text" 
                name="fuel_station" 
                placeholder="e.g. HPCL Highway Bunk - Salem Toll" 
                required
                style="width: 100%; padding: 12px 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px; font-weight: 600;"
            >
        </div>

        <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
                Odometer at Refill (KM)
            </label>
            <input 
                type="number" 
                name="opening_km" 
                value="{{ default_vehicle.current_km|default:0 }}" 
                required
                style="width: 100%; padding: 12px 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 15px; font-weight: 700;"
            >
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
                📸 Upload Fuel Slip / Bunk Receipt
            </label>
            <input 
                type="file" 
                name="receipt" 
                accept="image/*" 
                capture="environment"
                style="font-size: 12px; color: var(--text-secondary);"
            >
        </div>

        <button type="submit" class="btn btn-primary" style="padding: 15px; font-size: 16px;">
            ⛽ Submit Fuel Expense
        </button>
    </form>
</div>
{% endblock %}
