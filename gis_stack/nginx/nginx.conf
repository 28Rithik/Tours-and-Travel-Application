worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" cache:$upstream_cache_status rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json application/javascript text/css application/x-protobuf;

    # =========================================================================
    # Edge Caching Zone for Map Tiles (5 GB max disk storage)
    # =========================================================================
    proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tile_cache:50m max_size=5g inactive=7d use_temp_path=off;

    # =========================================================================
    # Upstream Clusters
    # =========================================================================
    upstream osrm_cluster {
        least_conn;
        server osrm_1:5000 max_fails=3 fail_timeout=10s;
        server osrm_2:5000 max_fails=3 fail_timeout=10s;
    }

    upstream tileserver_backend {
        server tileserver:8080;
    }

    # =========================================================================
    # 1. Unified GIS Gateway (Port 80)
    # =========================================================================
    server {
        listen 80;
        server_name localhost;

        # Health Probe
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"TravelERP GIS Gateway","cache_zone":"active"}';
        }

        # OSRM Routing Engine (Load-Balanced)
        location /route/ {
            proxy_pass http://osrm_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # TileServer GL Cached Tiles
        location / {
            proxy_pass http://tileserver_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Edge Caching Rules for vector & raster tiles
            proxy_cache tile_cache;
            proxy_cache_key $scheme$request_method$host$request_uri;
            proxy_cache_valid 200 304 7d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            # Browser & Client Cache Headers
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header Access-Control-Allow-Origin *;
        }
    }

    # =========================================================================
    # 2. Dedicated Load-Balanced OSRM Port (Port 5000)
    # =========================================================================
    server {
        listen 5000;
        server_name localhost;

        location / {
            proxy_pass http://osrm_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            add_header X-Routing-Engine "OSRM-LoadBalanced-Cluster" always;
        }
    }

    # =========================================================================
    # 3. Dedicated Cached TileServer Port (Port 8080)
    # =========================================================================
    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://tileserver_backend;
            proxy_set_header Host $host;
            proxy_cache tile_cache;
            proxy_cache_key $scheme$request_method$host$request_uri;
            proxy_cache_valid 200 304 7d;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=604800, immutable";
            add_header Access-Control-Allow-Origin *;
        }
    }
}
